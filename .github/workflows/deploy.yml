name: Deploy to Render

on:
  push:
    branches: [main]
    # only redeploy when something the API actually uses changes
    paths:
      - "src/**"
      - "models/model.pkl"
      - "dataset/phishing_domains_1000.csv"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  build:
    name: Check the Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t phishing-detection-api .

  deploy:
    name: Trigger Render deploy
    needs: build # nothing is deployed if the build fails
    runs-on: ubuntu-latest
    steps:
      - name: Call the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Add the RENDER_DEPLOY_HOOK_URL secret in Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy requested. Watch the Deploys tab in Render."
